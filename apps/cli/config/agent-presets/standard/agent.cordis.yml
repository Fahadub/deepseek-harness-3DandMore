# إعداد الوكيل «القياسي» (standard): وكيل البرمجة الكامل، يُركَّب مرة واحدة لكل عملية.
#
# هذا الملف تركيبة على مستوى الوكيل. يركّبه السجل مرة واحدة تحت نطاق
# قائم؛ كل جلسة تسمّيه تنضم بالنسب للنطاق، فالأدوات وأقسام الموجهات
# المسجلة هنا تغطي كل وكيل منضم بينما حالة الجلسة نفسها تبقى مفتّحة
# بالجلسة/الوكيل داخل الإضافات. تركيبة المضيف (`base.cordis.yml` +
# `web.cordis.yml`) تحفظ كل ما لا يجوز لإعداد امتلاكه: السجلات نفسها،
# ورصة الـsandbox والموافقات، والاستمرارية، ومسار النموذج.
#
# صف الخدمة هنا يجب أن يقيم داخل مجموعة تحمل نطاق `isolate`. بدونه
# ينشر في النطاق الجذري فيصبح عالمياً على العملية — أي إعداد آخر ينشر
# نفس الاسم يصطدم، وقارئ مضيف سيحلّ مثيل إعداد واحد لكل جلسة؛ يرفض
# `dsh-agent-presets` ذلك عند التركيب. `true` تعني نطاقاً محلياً
# بالمدخل: مثيل خاص بهذا التركيب القائم، منفصل عن كل إعداد آخر.
# (التسمية المشتركة لا تجمّع الأمثلة — `provide()` يرمي عند التسجيل
# الثاني تحت رمز النطاق نفسه؛ التسميات تنضم إلى النطاقات وليست ما
# يحتاجه هذا الملف.)

# ── الهوية ────────────────────────────────────────────────────────────────

# شخصية الإعداد الخاصة به، تحل محل افتراضي النشر لهذا الوكيل.
# يُحلّ `{{model}}` و`{{cwd}}` من مسار هذا الوكيل ومساحة عمله.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# يبقى `shell-env` في تركيبة المضيف: يحقنه `apps/cli/src/web.ts` لنشر
# `DSH_WEB_URL`/`DSH_WEB_MODE`، ووجود صف مضيف يحقن خدمة هو معيار الملكية
# لمستوى المضيف — الحقن يُحلّ قبل وجود أي جلسة فلا يوجد وكيل يُفتّح به.
# خلف نطاق إعداد لا تصل تلك المتغيرات إلى صدفة النموذج أصلاً. تستهلك
# أداتا الصدفة سجل المضيف من هنا؛ ومنفّذاهما (`bash-sandbox`/`pwsh-sandbox`)
# على مستوى المضيف أيضاً.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── نظام الملفات ──────────────────────────────────────────────────────────────

# كلتاهما تسجّل في سجل `tools` الخاص بالمضيف ولا تقدّم شيئاً، فلا
# تحتاجان نطاقاً. خدمة `fs` وسياستها تبقيان في المضيف.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── المهام الخلفية ────────────────────────────────────────────────────────

# عناصر التحكم الموجهة للنموذج فقط. سجلّ المهام يبقى على مستوى المضيف:
# منتجوه يقيمون خارج أي نطاق يمكن لهذا الملف وضعه فيه — `tool-bash`
# أعلاه يحلّه عبر `ctx.get`، والنطاق المحلي بالمدخل غير مرئي لكل صف
# شقيق، فسيجيب `run_in_background` بـ«المهام الخلفية غير متاحة» بينما
# هذه العناصر جالسة في الفهرس. السجل مفتّح بالوكيل المالك على أي حال،
# فمثيل مضيف واحد يخدم كل جلسة. ما يختاره الإعداد هو إن كان وكيله
# يستطيع جمع عمل خلفي وإيقافه من الأساس.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── المهارات ──────────────────────────────────────────────────────────────────

# سجلّ المهارات يقيم في تركيبة المضيف ويُطبَّق طبقات لكل نطاق: هذه
# الصفوف تسجّل في طبقة هذا الإعداد منه، فلا تحتاج نطاقاً. يضيف
# `skill-filesystem` اكتشاف الجذر المحلي لوكلاء هذا الإعداد، ويعطيهم
# `tool-skill` الفهرس والمحمّل؛ ويحمل الفهرس المدموج أيضاً ما سجّله
# النشر عالمياً (إضافات المستودع).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── الأهداف ───────────────────────────────────────────────────────────────────

# الأداة الموجهة للنموذج فقط. خدمة الهدف ومشغّل جلستها وأمر `/goal`
# يبقون على مستوى المضيف: يقدّم الـGateway نطاق الأهداف كنقاط نهاية Remote
# مستقبلها من موصِف مولَّد، فيحلّ `goals` على المضيف وكان النطاق المحلي
# هنا سيخفيه. السجل مفتّح بالجلسة على أي حال، فمثيل مضيف واحد يخدم كل
# جلسة. ما يختاره الإعداد هو إن كان وكيله يستطيع مناداة أداة الهدف.
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── وضع التخطيط ───────────────────────────────────────────────────────────────

# حالة الخطة لكل وكيل بطبيعتها، فالنطاق المحلي بالمدخل ليس حلاً
# مؤقتاً هنا — بل هو العمر الصحيح.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# يقرأ `compaction-basic` قيمة `toolResultPrune` عبر `ctx.get`، فيجب أن
# يشارك المُقشِّر هذا النطاق لا أن يقيم خارجه.
#
# `tokenMeter` خارج هذا النطاق عمداً: يبقى العدّاد على مستوى المضيف،
# والصفوف هنا تحلّ ذلك المثيل الواحد. لا يأخذ تهيئة، يفتّح كل طيّة
# بالجلسة، ويملك وحدات إسقاط عدّاد السياق التي يقرؤها المتصفح لكل
# جلسة — خلف نطاق تأتي تلك الوحدات وتذهب مع أي إضافات محمّلة. ما
# يختاره الإعداد هو إن كان وكيله يضغط أصلاً، وهو `compaction-basic` أدناه.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# سجلّ `subagents` ومنفّذا spawn/fork يقيمان في تركيبة المضيف: السجل
# singleton على مستوى العملية تخدم استعلاماته العابرة للجلسات واجهة
# api-proxy للمتصفح، ولا يمكن تسجيل اسم مزود إلا مرة. يسهّم هذا الإعداد
# أدوات التفويض التي تحلّ ذلك السجل.
#
# `workflows` مختلف — لا شيء خارج وكيل يقرؤه — لذا يتشارك كل صف
# يصل إليه نطاقاً محلياً واحداً بالمدخل هنا، ومستهلك تُرك خارجه سيحلّ
# سجل مضيف لا يعبّئه هذا الإعداد.
#
# `tool-subagent-report` على مستوى المضيف لنفس سبب السجل، لا لأن إعداداً
# قد لا يريده: يسجّل إعداداً قابلاً للاستمرار على ذلك الـsingleton لا
# أداة يناديها هذا الوكيل، وقائمة الإعداد غير واعية بالنطاق — نسخة
# واحدة لكل إعداد محمّل تعني أن كل ابن ينال `report` مسجلاً مرة لكل
# جلسة حية، وهو ما يرمي عند الثانية.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # مزودات المنتجات singletons على مستوى المضيف. انسخ هذا الإعداد ثم
    # أزل `disabled` من أحد صفَّي الأداة العاديين لكشف ذلك المنتج
    # لوكلاء النسخة وحدها.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# خدمة `web` ومزود البحث الخاص بها يبقيان في تركيبة المضيف؛ الأداة
# الموجهة للنموذج فقط لكل جلسة.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
